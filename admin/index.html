const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n||0)), today=()=>new Date().toISOString().slice(0,10);
let projects=[],docs=[],items=[],rsvps=[],tab='orders',selectedCustomer=null,selectedProject=null;

function showModal(html){$('modal').innerHTML=html;$('modalbg').classList.remove('hidden')};function closeModal(){$('modalbg').classList.add('hidden')};$('modalbg').addEventListener('click',e=>{if(e.target===$('modalbg'))closeModal()});
function err(e){console.error(e);alert(e?.message||String(e))}async function query(table,op='select',payload){let q=db.from(table);if(op==='select')q=q.select('*');else if(op==='insert')q=q.insert(payload).select().single();let r=await q;if(r.error)throw r.error;return r.data}
async function refresh(){const [p,d,i,r]=await Promise.all([query('projects'),query('documents'),query('document_items'),query('rsvps')]);projects=p||[];docs=d||[];items=i||[];rsvps=r||[];render()}
function isCustomerProject(p){return String(p.slug||'').startsWith('kunde-')};function customerKey(d){return (d.customer_name||projects.find(p=>p.id===d.project_id)?.title||'Unbekannter Kunde').trim()};
function customerNames(){return [...new Set(docs.map(customerKey))].sort((a,b)=>a.localeCompare(b,'de'))};function customerDocs(name){return docs.filter(d=>customerKey(d)===name).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))};

function renderOrders(){const names=customerNames();if(selectedCustomer){renderCustomer(selectedCustomer);return} $('main').innerHTML=`<div class="head"><div><h1>Aufträge</h1><p>Alle Kunden, Angebote, Auftragsbestätigungen und Rechnungen.</p></div><button class="btn primary" onclick="newOffer()">+ Neues Angebot</button></div><div class="stack">${names.length?names.map(name=>{let ds=customerDocs(name),offers=ds.filter(d=>d.document_type==='offer'),orders=ds.filter(d=>d.document_type==='order_confirmation');return `<div class="card click" onclick="selectCustomer('${encodeURIComponent(name)}')"><div class="line"><div><h2>${esc(name)}</h2><span class="muted">${offers.length} Angebote · ${orders.length} Aufträge · ${ds.length} Dokumente</span></div><span class="pill">Ansehen ›</span></div></div>`}).join(''):'<div class="empty">Noch keine Kunden. Erstelle dein erstes Angebot.</div>'}</div>`}
function selectCustomer(encoded){selectedCustomer=decodeURIComponent(encoded);renderOrders()};function backCustomers(){selectedCustomer=null;renderOrders()};
function renderCustomer(name){const ds=customerDocs(name);$('main').innerHTML=`<button class="btn back" onclick="backCustomers()">← Alle Kunden</button><div class="head"><div><h1>${esc(name)}</h1><p>Angebote annehmen oder ablehnen, Auftragsbestätigungen und Rechnungen verwalten.</p></div><button class="btn primary" onclick="newOffer('${encodeURIComponent(name)}')">+ Angebot</button></div><div class="stack">${ds.length?ds.map(d=>`<div class="card"><div class="line"><div><strong>${esc(TYPES[d.document_type]||d.document_type)} · ${esc(d.document_number||'')}</strong><div class="muted">${esc(d.issue_date||'')} · ${esc(STAT[d.status]||d.status)}</div></div><strong>${eur(d.total)}</strong></div><div class="actions"><button class="btn small" onclick="editDoc('${d.id}')">Bearbeiten</button><button class="btn small" onclick="pdfDoc('${d.id}')">PDF</button>${d.document_type==='offer'?`<button class="btn small primary" onclick="decide('${d.id}','accepted')">Annehmen</button><button class="btn small" onclick="decide('${d.id}','rejected')">Ablehnen</button>`:''}${d.document_type==='order_confirmation'?`<button class="btn small primary" onclick="invoice('${d.id}','deposit_invoice')">Anzahlung</button><button class="btn small primary" onclick="invoice('${d.id}','final_invoice')">Schlussrechnung</button>`:''}<button class="btn small danger" onclick="deleteDoc('${d.id}')">Löschen</button></div></div>`).join(''):'<div class="empty">Noch keine Dokumente.</div>'}</div>`}
function itemRows(data=[{description:'',quantity:1,unit_price:0}]){return data.map(x=>`<div class="item"><div class="field"><label>Leistung / Position</label><input class="desc" value="${esc(x.description)}" placeholder="Leistung" required></div><div class="field"><label>Menge</label><input class="qty" type="number" step="0.01" min="0" value="${Number(x.quantity||1)}" required></div><div class="field"><label>Preis €</label><input class="price" type="number" step="0.01" min="0" value="${Number(x.unit_price||0)}" required></div><button class="btn small danger remove" type="button" onclick="this.closest('.item').remove();updateSum()">×</button></div>`).join('')};
function addItem(){ $('itemList').insertAdjacentHTML('beforeend',itemRows());updateSum()};function readItems(){return [...document.querySelectorAll('#itemList .item')].map((e,i)=>({position:i+1,description:e.querySelector('.desc').value.trim(),quantity:Number(e.querySelector('.qty').value),unit_price:Number(e.querySelector('.price').value),total:Math.round(Number(e.querySelector('.qty').value)*Number(e.querySelector('.price').value)*100)/100})).filter(x=>x.description)};
function updateSum(){if($('sum'))$('sum').textContent=eur(readItems().reduce((s,x)=>s+x.total,0))};
function docForm({d=null,name='',projectId=null,type='offer',sourceId=null}={}){const existing=d?items.filter(x=>x.document_id===d.id).sort((a,b)=>a.position-b.position):[];const val=(key)=>esc(d?.[key]||'');const label=TYPES[d?.document_type||type];showModal(`<div class="head"><h2>${d?'Dokument bearbeiten':'Neues '+label}</h2><button class="btn" onclick="closeModal()">Schließen</button></div><form id="docForm"><div class="grid"><div class="field wide"><label>Kundenname</label><input id="fName" value="${esc(d?.customer_name||name)}" required></div><div class="field"><label>Dokumentnummer</label><input id="fNumber" value="${esc(d?.document_number||'')}" placeholder="Wird automatisch vergeben" ></div><div class="field"><label>Datum</label><input id="fDate" type="date" value="${esc(d?.issue_date||today())}" required></div><div class="field wide"><label>Straße / Hausnummer</label><input id="fStreet" value="${val('customer_street')}"></div><div class="field"><label>PLZ</label><input id="fZip" value="${val('customer_zip')}"></div><div class="field"><label>Ort</label><input id="fCity" value="${val('customer_city')}"></div><div class="field wide"><label>Notizen</label><textarea id="fNotes">${val('notes')}</textarea></div>${(d?.document_type||type)==='order_confirmation'?`<div class="field"><label>Vereinbarte Anzahlung €</label><input id="fDeposit" type="number" step="0.01" min="0" value="${Number(d?.deposit_amount||0)}"></div>`:''}</div><hr class="divider"><h2>Positionen</h2><div id="itemList">${itemRows(existing.length?existing:[{description:'',quantity:1,unit_price:0}])}</div><button type="button" class="btn" onclick="addItem()">+ Position hinzufügen</button><div class="summary">Gesamt: <span id="sum">0,00 €</span></div><div id="formError" class="status"></div><button class="btn primary" id="saveBtn">Speichern</button></form>`);$('itemList').addEventListener('input',updateSum);updateSum();$('docForm').onsubmit=async e=>{e.preventDefault();const btn=$('saveBtn');btn.disabled=true;try{const rows=readItems();if(!rows.length)throw Error('Bitte mindestens eine Position eingeben.');const customer=$('fName').value.trim();if(!customer)throw Error('Bitte Kundennamen eingeben.');let pid=d?.project_id||projectId;if(!pid){pid=await ensureCustomerProject(customer)}const sum=rows.reduce((s,x)=>s+x.total,0);const payload={project_id:pid,document_type:d?.document_type||type,document_number:$('fNumber').value.trim()||(await numberFor(d?.document_type||type)),status:d?.status||'draft',issue_date:$('fDate').value,customer_name:customer,customer_street:$('fStreet').value.trim(),customer_zip:$('fZip').value.trim(),customer_city:$('fCity').value.trim(),customer_country:'Deutschland',subtotal:sum,total:sum,tax_rate:0,tax_amount:0,discount_type:'none',discount_value:0,discount_amount:0,notes:$('fNotes').value.trim()||null};if(!d){payload.source_document_id=sourceId||null;payload.deposit_amount=0;payload.paid_amount=0;}if($('fDeposit'))payload.deposit_amount=Number($('fDeposit').value)||0;let id=d?.id;if(d){const res=await db.from('documents').update(payload).eq('id',id).select('id').single();if(res.error)throw res.error}else{const res=await db.from('documents').insert(payload).select('id').single();if(res.error)throw res.error;id=res.data.id}const del=await db.from('document_items').delete().eq('document_id',id);if(del.error)throw del.error;const ins=await db.from('document_items').insert(rows.map(r=>({...r,document_id:id})));if(ins.error)throw ins.error;selectedCustomer=customer;closeModal();await refresh()}catch(ex){$('formError').textContent=ex.message;btn.disabled=false}}}
async function ensureCustomerProject(name){const old=projects.find(p=>isCustomerProject(p)&&p.title===name);if(old)return old.id;const slug='kunde-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);const res=await db.from('projects').insert({title:name,slug,status:'active'}).select('id').single();if(res.error)throw Error('Kundenanlage fehlgeschlagen: '+res.error.message);return res.data.id}
async function numberFor(type){const prefix={offer:'ANG',order_confirmation:'AB',deposit_invoice:'AR',final_invoice:'SR'}[type]||'DOC';return prefix+'-'+new Date().getFullYear()+'-'+Date.now().toString().slice(-7)}
function newOffer(encoded=''){docForm({name:encoded?decodeURIComponent(encoded):''})};function editDoc(id){const d=docs.find(x=>x.id===id);if(d)docForm({d})}
async function clone(source,type,extra={}){const payload={...source};delete payload.id;delete payload.created_at;delete payload.updated_at;Object.assign(payload,{document_type:type,document_number:await numberFor(type),source_document_id:source.id,issue_date:today(),status:type==='order_confirmation'?'accepted':'open',...extra});const res=await db.from('documents').insert(payload).select('id').single();if(res.error)throw res.error;const src=items.filter(x=>x.document_id===source.id);if(src.length){const rows=src.map(x=>({document_id:res.data.id,position:x.position,description:x.description,quantity:x.quantity,unit_price:x.unit_price,total:x.total}));const ins=await db.from('document_items').insert(rows);if(ins.error)throw ins.error}return res.data.id}
async function decide(id,status){const d=docs.find(x=>x.id===id);if(!d)return;if(!confirm(status==='accepted'?'Angebot annehmen und Auftragsbestätigung erstellen?':'Angebot ablehnen?'))return;try{const up=await db.from('documents').update({status}).eq('id',id);if(up.error)throw up.error;if(status==='accepted'&&!docs.some(x=>x.document_type==='order_confirmation'&&x.source_document_id===id))await clone(d,'order_confirmation');await refresh()}catch(e){err(e)}}
async function invoice(id,type){const d=docs.find(x=>x.id===id);if(!d)return;const existing=docs.find(x=>x.source_document_id===id&&x.document_type===type);if(existing){editDoc(existing.id);return}try{const newId=await clone(d,type,{deposit_amount:type==='deposit_invoice'?Number(d.deposit_amount||0):0});await refresh();editDoc(newId)}catch(e){err(e)}}
async function deleteDoc(id){const d=docs.find(x=>x.id===id);if(!d)return;const related=docs.filter(x=>x.source_document_id===id);if(related.length){alert('Dieses Dokument hat verknüpfte Aufträge oder Rechnungen. Lösche zuerst die abhängigen Dokumente.');return}if(!confirm(`${TYPES[d.document_type]} ${d.document_number} wirklich dauerhaft löschen?`))return;try{const di=await db.from('document_items').delete().eq('document_id',id);if(di.error)throw di.error;const del=await db.from('documents').delete().eq('id',id).select('id');if(del.error)throw del.error;if(!del.data?.length)throw Error('Die Datenbank hat das Löschen nicht erlaubt. Bitte die DELETE-Berechtigung (RLS) für documents prüfen.');await refresh()}catch(e){err(e)}}
function pdfDoc(id){const d=docs.find(x=>x.id===id);if(!d)return;const {jsPDF}=window.jspdf||{};if(!jsPDF){alert('PDF-Bibliothek nicht geladen');return}const pdf=new jsPDF({unit:'mm',format:'a4'});const left=20,right=190;pdf.setTextColor(45,32,25);pdf.setFont('helvetica','normal');pdf.setFontSize(27);pdf.text('KUMÉ',left,25);pdf.setFontSize(9);pdf.text('EVENT',left,31);pdf.setDrawColor(190,165,145);pdf.line(left,38,right,38);pdf.setFontSize(17);pdf.text(TYPES[d.document_type]||'Dokument',left,52);pdf.setFontSize(9);pdf.text('Nummer: '+(d.document_number||''),left,61);pdf.text('Datum: '+(d.issue_date||''),left,67);pdf.setFontSize(10);pdf.text(d.customer_name||'',left,83);pdf.setFontSize(9);let y=89;for(const v of [d.customer_street,[d.customer_zip,d.customer_city].filter(Boolean).join(' '),d.customer_country]){if(v){pdf.text(v,left,y);y+=5}}const data=items.filter(x=>x.document_id===id).sort((a,b)=>a.position-b.position);pdf.autoTable({startY:Math.max(110,y+10),head:[['Leistung','Menge','Einzelpreis','Gesamt']],body:data.map(x=>[x.description,String(x.quantity),eur(x.unit_price),eur(x.total)]),theme:'striped',margin:{left,right:20,bottom:72},styles:{fontSize:9,cellPadding:3},headStyles:{fillColor:[87,62,48]}});y=pdf.lastAutoTable.finalY+12;if(y>195){pdf.addPage();y=25}pdf.setFontSize(11);pdf.text('Gesamt: '+eur(d.total),right,y,{align:'right'});y+=10;if(d.notes){pdf.setFontSize(8);const lines=pdf.splitTextToSize(d.notes,170);if(y+lines.length*4>220){pdf.addPage();y=25}pdf.text(lines,left,y)}// Auf jeder Seite gleiches Layout; Zahlungsdaten nur auf Rechnungen.
const count=pdf.getNumberOfPages();for(let page=1;page<=count;page++){pdf.setPage(page);pdf.setDrawColor(220,205,191);pdf.line(left,241,right,241);{pdf.setTextColor(68,47,36);pdf.setFontSize(8);pdf.text('ZAHLUNGSINFORMATIONEN',left,249);pdf.text('Banküberweisung · Kubilay Cicek',left,256);pdf.text('IBAN: DE28100123450828560901',left,262);pdf.text('BIC: TRBKDEBBXXX',left,268);pdf.text('PayPal: info@carabic.shop',left,275)}pdf.setFontSize(7);pdf.setTextColor(110,95,84);pdf.text('KUMÉ EVENT · Inhaber: Kubilay Cicek',left,287)}pdf.save((d.document_number||'Dokument').replace(/[^a-z0-9-_]/gi,'_')+'.pdf')}
function renderProjects(){if(selectedProject){renderProjectDetail(selectedProject);return}const list=projects.filter(p=>!isCustomerProject(p)).sort((a,b)=>String(a.title).localeCompare(String(b.title),'de'));$('main').innerHTML=`<div class="head"><div><h1>Projekte</h1><p>Digitale Einladungen und Gästeverwaltung.</p></div></div><div class="stack">${list.length?list.map(p=>`<div class="card click" onclick="selectProject('${p.id}')"><div class="line"><div><h2>${esc(p.title)}</h2><span class="muted">${esc(p.event_date||'')} · ${rsvps.filter(r=>r.project_id===p.id).length} Rückmeldungen</span></div><span class="pill">Öffnen ›</span></div></div>`).join(''):'<div class="empty">Noch keine digitalen Einladungsprojekte vorhanden.</div>'}</div>`}
function selectProject(id){selectedProject=id;renderProjects()};function backProjects(){selectedProject=null;renderProjects()};function renderProjectDetail(id){const p=projects.find(x=>x.id===id);if(!p){selectedProject=null;renderProjects();return}const rr=rsvps.filter(x=>x.project_id===id).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));const yes=rr.filter(x=>x.attendance==='yes'),no=rr.filter(x=>x.attendance==='no');$('main').innerHTML=`<button class="btn back" onclick="backProjects()">← Alle Projekte</button><div class="head"><div><h1>${esc(p.title)}</h1><p>${esc(p.event_date||'')} · Digitale Einladung</p></div><button class="btn" onclick="editProject('${id}')">Projekt bearbeiten</button></div><div class="actions">${p.invitation_url?`<a class="btn" href="${esc(p.invitation_url)}" target="_blank" rel="noopener">Einladung öffnen ↗</a>`:''}<button class="btn primary" onclick="editRsvp(null,'${id}')">+ Rückmeldung</button><button class="btn" onclick="exportCsv('${id}')">CSV exportieren</button></div><div class="stats"><div class="stat"><strong>${yes.length}</strong>Zusagen</div><div class="stat"><strong>${no.length}</strong>Absagen</div><div class="stat"><strong>${yes.reduce((n,x)=>n+Number(x.guest_count||1),0)}</strong>Gäste zugesagt</div></div><h2>Rückmeldungen</h2><div class="stack">${rr.length?rr.map(r=>`<div class="card"><div class="line"><strong>${esc(r.guest_name)}</strong><span class="pill">${r.attendance==='yes'?'Zusage':'Absage'} · ${Number(r.guest_count||1)} Pers.</span></div>${r.message?`<p>${esc(r.message)}</p>`:''}<div class="actions"><button class="btn small" onclick="editRsvp('${r.id}','${id}')">Bearbeiten</button><button class="btn small danger" onclick="deleteRsvp('${r.id}')">Löschen</button></div></div>`).join(''):'<div class="empty">Noch keine Rückmeldungen.</div>'}</div>`}
function editProject(id){const p=projects.find(x=>x.id===id);showModal(`<div class="head"><h2>Projekt bearbeiten</h2><button class="btn" onclick="closeModal()">Schließen</button></div><form id="projectForm" class="grid"><div class="field wide"><label>Projektname</label><input id="pTitle" value="${esc(p.title)}" required></div><div class="field"><label>Eventdatum</label><input id="pDate" type="date" value="${esc(p.event_date||'')}"></div><div class="field wide"><label>Einladungs-URL</label><input id="pUrl" type="url" value="${esc(p.invitation_url||'')}"></div><button class="btn primary">Speichern</button><div id="pError" class="status"></div></form>`);$('projectForm').onsubmit=async e=>{e.preventDefault();try{const res=await db.from('projects').update({title:$('pTitle').value.trim(),event_date:$('pDate').value||null,invitation_url:$('pUrl').value.trim()||null}).eq('id',id);if(res.error)throw res.error;closeModal();await refresh()}catch(ex){$('pError').textContent=ex.message}}}
function editRsvp(id,pid){const r=rsvps.find(x=>x.id===id)||{};showModal(`<div class="head"><h2>${id?'Rückmeldung bearbeiten':'Rückmeldung hinzufügen'}</h2><button class="btn" onclick="closeModal()">Schließen</button></div><form id="rForm" class="grid"><div class="field wide"><label>Name</label><input id="rName" value="${esc(r.guest_name||'')}" required></div><div class="field"><label>Teilnahme</label><select id="rAttend"><option value="yes" ${r.attendance==='yes'?'selected':''}>Zusage</option><option value="no" ${r.attendance==='no'?'selected':''}>Absage</option></select></div><div class="field"><label>Personen</label><input id="rCount" type="number" min="1" max="99" value="${Number(r.guest_count||1)}"></div><div class="field wide"><label>Nachricht</label><textarea id="rMessage">${esc(r.message||'')}</textarea></div><button class="btn primary">Speichern</button><div id="rError" class="status"></div></form>`);$('rAttend').value=r.attendance||'yes';$('rForm').onsubmit=async e=>{e.preventDefault();try{const payload={project_id:pid,guest_name:$('rName').value.trim(),attendance:$('rAttend').value,guest_count:Number($('rCount').value)||1,message:$('rMessage').value.trim()};const res=id?await db.from('rsvps').update(payload).eq('id',id):await db.from('rsvps').insert(payload);if(res.error)throw res.error;closeModal();await refresh()}catch(ex){$('rError').textContent=ex.message}}}
async function deleteRsvp(id){if(!confirm('Rückmeldung löschen?'))return;try{const res=await db.from('rsvps').delete().eq('id',id).select('id');if(res.error)throw res.error;if(!res.data?.length)throw Error('Löschen durch Datenbankberechtigung blockiert.');await refresh()}catch(e){err(e)}}
function exportCsv(pid){const rows=[['Name','Teilnahme','Personen','Nachricht'],...rsvps.filter(x=>x.project_id===pid).map(r=>[r.guest_name,r.attendance,r.guest_count,r.message])];const csv='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='rueckmeldungen.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('tabOrders').onclick=()=>{tab='orders';selectedProject=null;render()};$('tabProjects').onclick=()=>{tab='projects';selectedCustomer=null;render()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const res=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(res.error){$('loginError').textContent=res.error.message;return}await start()};async function start(){const {data:{session}}=await db.auth.getSession();$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(session){try{await refresh()}catch(e){$('main').innerHTML='<div class="alert">Daten konnten nicht geladen werden: '+esc(e.message)+'</div>'}}}start();
</script></body></html>
